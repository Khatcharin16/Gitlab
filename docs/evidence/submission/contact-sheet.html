  <h1>Lab 04 — Browser Acceptance B1–B8</h1>

    <figure><img src="../tooling-playwright/B2-dc.png" alt="DC operating point"><figcaption><b>B2 · DC .op <span class="pass">PASS</span></b>VB 1.97 V · VE 1.34 V · VC 9.08 V · VCE 7.75 V · IC 1.33 mA — <code>lab04-dc-1rsj5oto</code></figcaption></figure>
